<svg xmlns="http://www.w3.org/2000/svg" width="800" height="70" viewBox="0 0 800 70">
  <defs>
    <linearGradient id="tglow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#58a6ff"/>
      <stop offset="0.5" stop-color="#e63946"/>
      <stop offset="1" stop-color="#58a6ff"/>
    </linearGradient>
  </defs>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="24" font-weight="600" text-anchor="middle">
    <text x="400" y="42" fill="#e63946">
      Hello, I'm Potrinathan P M
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.001;0.1667;1" dur="15s" begin="0s" repeatCount="indefinite"/>
    </text>
    <text x="400" y="42" fill="#e63946">
      Friendly neighborhood developer
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.2;0.3667;1" dur="15s" begin="0s" repeatCount="indefinite"/>
    </text>
    <text x="400" y="42" fill="#e63946">
      Full-Stack Developer | System Design | Automation
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.4;0.5667;1" dur="15s" begin="0s" repeatCount="indefinite"/>
    </text>
    <text x="400" y="42" fill="#e63946">
      Building products, not just projects
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.6;0.7667;1" dur="15s" begin="0s" repeatCount="indefinite"/>
    </text>
    <text x="400" y="42" fill="#e63946">
      With great code comes great responsibility
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.8;0.9667;1" dur="15s" begin="0s" repeatCount="indefinite"/>
    </text>
  </g>

  <rect x="750" y="24" width="4" height="26" rx="2" fill="url(#tglow)">
    <animate attributeName="opacity" values="1;0;1" dur="1s" begin="0s" repeatCount="indefinite"/>
  </rect>
</svg>
