<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340">

<style>
  @keyframes pulse { 0%,100%{opacity:.6} 50%{opacity:1} }
  @keyframes glow  { 0%,100%{opacity:.32} 50%{opacity:.68} }
  @keyframes webshine { 0%,100%{opacity:.10} 50%{opacity:.26} }
  @keyframes swing { 0%,100%{ transform: rotate(6deg);} 50%{ transform: rotate(-6deg);} }
  .title   { animation: pulse 3.2s ease-in-out infinite; }
  .halo    { animation: glow  4.0s ease-in-out infinite; }
  .web     { animation: webshine 5s ease-in-out infinite; }
  .swing   { transform-origin: 600px 0px; animation: swing 4.5s ease-in-out infinite; }
</style>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#050914"/>
    <stop offset="0.45" stop-color="#0a1128"/>
    <stop offset="0.78" stop-color="#341024"/>
    <stop offset="1" stop-color="#6b1220"/>
  </linearGradient>
  <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
    <stop offset="0" stop-color="#e63946" stop-opacity=".8"/>
    <stop offset="0.55" stop-color="#e63946" stop-opacity=".22"/>
    <stop offset="1" stop-color="#e63946" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="vignette" cx="0.5" cy="0.5" r="0.75">
    <stop offset="0" stop-color="#000000" stop-opacity="0"/>
    <stop offset="1" stop-color="#000000" stop-opacity="0.42"/>
  </radialGradient>
  <linearGradient id="titleGrad" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#ffffff"/>
    <stop offset="0.5" stop-color="#ffd9dc"/>
    <stop offset="1" stop-color="#ffffff"/>
  </linearGradient>
  <linearGradient id="redline" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#e63946" stop-opacity="0"/>
    <stop offset="0.5" stop-color="#e63946"/>
    <stop offset="1" stop-color="#e63946" stop-opacity="0"/>
  </linearGradient>
</defs>

<rect width="1200" height="340" fill="url(#bg)"/>
<rect width="1200" height="340" fill="url(#vignette)"/>

<g class="web"><g stroke="#ffffff" stroke-width="1.1" fill="none" stroke-linecap="round">
  <line x1="0" y1="0" x2="128" y2="0"/>
  <line x1="0" y1="0" x2="120" y2="41"/>
  <line x1="0" y1="0" x2="102" y2="76"/>
  <line x1="0" y1="0" x2="75" y2="104"/>
  <line x1="0" y1="0" x2="40" y2="122"/>
  <line x1="0" y1="0" x2="0" y2="128"/>
  <polyline points="40,0 38.6,10.4 34.6,20 28.3,28.3 20,34.6 10.4,38.6 0,40"/>
  <polyline points="84,0 81.1,21.7 72.7,42 59.4,59.4 42,72.7 21.7,81.1 0,84"/>
  <polyline points="118,0 114,30.5 102.2,59 83.4,83.4 59,102.2 30.5,114 0,118"/>
</g></g>

<g class="web" transform="scale(-1,1) translate(-1200,0)"><g stroke="#ffffff" stroke-width="1.1" fill="none" stroke-linecap="round">
  <line x1="0" y1="0" x2="128" y2="0"/>
  <line x1="0" y1="0" x2="120" y2="41"/>
  <line x1="0" y1="0" x2="102" y2="76"/>
  <line x1="0" y1="0" x2="75" y2="104"/>
  <line x1="0" y1="0" x2="40" y2="122"/>
  <line x1="0" y1="0" x2="0" y2="128"/>
  <polyline points="40,0 38.6,10.4 34.6,20 28.3,28.3 20,34.6 10.4,38.6 0,40"/>
  <polyline points="84,0 81.1,21.7 72.7,42 59.4,59.4 42,72.7 21.7,81.1 0,84"/>
  <polyline points="118,0 114,30.5 102.2,59 83.4,83.4 59,102.2 30.5,114 0,118"/>
</g></g>

<ellipse class="halo" cx="600" cy="180" rx="430" ry="165" fill="url(#halo)"/>

<g class="swing">
<line x1="600" y1="0" x2="600" y2="86" stroke="#c7cede" stroke-width="1.6" stroke-dasharray="3 4"/>
<g stroke="#0a0f1e" stroke-width="3.4" stroke-linecap="round" fill="#0a0f1e"><path d="M 595.4 93.7 C 582.8 81.0 574.7 74.2 567.8 67.2" /><path d="M 604.6 93.7 C 617.2 81.0 625.3 74.2 632.2 67.2" /><path d="M 592.0 97.2 C 577.0 90.2 566.6 86.8 556.3 78.8" /><path d="M 608.0 97.2 C 623.0 90.2 633.4 86.8 643.7 78.8" /><path d="M 590.8 102.9 C 575.9 101.8 565.5 105.2 555.1 102.9" /><path d="M 609.2 102.9 C 624.1 101.8 634.5 105.2 644.9 102.9" /><path d="M 592.0 108.7 C 578.1 113.2 569.0 119.0 560.9 127.0" /><path d="M 608.0 108.7 C 621.9 113.2 631.0 119.0 639.1 127.0" /><ellipse cx="600" cy="97.2" rx="9.2" ry="6.9"/><ellipse cx="600" cy="114.4" rx="11.5" ry="16.1"/><path d="M 600 111.0 L 603.5 114.4 L 600 117.8 L 596.5 114.4 Z" fill="#e63946"/></g>
</g>

<g text-anchor="middle">
  <text class="title" x="600" y="208" font-size="72" font-weight="700" letter-spacing="14" fill="url(#titleGrad)" font-family="Georgia, 'Times New Roman', serif">POTRINATHAN P M</text>

  <line x1="468" y1="236" x2="586" y2="236" stroke="url(#redline)" stroke-width="2"/>
  <line x1="614" y1="236" x2="732" y2="236" stroke="url(#redline)" stroke-width="2"/>
  <rect x="596" y="230" width="8" height="8" transform="rotate(45 600 234)" fill="#e63946"/>

  <text x="600" y="278" font-size="21" font-weight="600" letter-spacing="7" fill="#ff3d4d" font-family="Segoe UI, 'Helvetica Neue', Arial, sans-serif">FULL-STACK DEVELOPER · AI / ML · SYSTEM DESIGN</text>
  <text x="600" y="314" font-size="14" font-weight="500" letter-spacing="5" fill="#9fb0d8" font-family="Segoe UI, 'Helvetica Neue', Arial, sans-serif">BUILDING PRODUCTS · NOT JUST PROJECTS</text>
</g>

</svg>
