<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340">

<style>
  @keyframes pulse { 0%,100%{opacity:.55} 50%{opacity:1} }
  @keyframes glow  { 0%,100%{opacity:.35} 50%{opacity:.75} }
  @keyframes webshine { 0%,100%{opacity:.12} 50%{opacity:.3} }
  .title   { animation: pulse 3.2s ease-in-out infinite; }
  .halo    { animation: glow  4.0s ease-in-out infinite; }
  .web      { animation: webshine 5s ease-in-out infinite; }
  .swing   { transform-origin: 600px 0px; animation: swing 4.5s ease-in-out infinite; }
  @keyframes swing { 0%,100%{ transform: rotate(7deg);} 50%{ transform: rotate(-7deg);} }
</style>
