<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340">

<style>
  @keyframes pulse { 0%,100%{opacity:.55} 50%{opacity:1} }
  @keyframes glow  { 0%,100%{opacity:.35} 50%{opacity:.75} }
  @keyframes webshine { 0%,100%{opacity:.10} 50%{opacity:.26} }
  @keyframes swing { 0%,100%{ transform: rotate(6deg);} 50%{ transform: rotate(-6deg);} }
  .title   { animation: pulse 3.2s ease-in-out infinite; }
  .halo    { animation: glow  4.0s ease-in-out infinite; }
  .web     { animation: webshine 5s ease-in-out infinite; }
  .swing   { transform-origin: 600px 0px; animation: swing 4.5s ease-in-out infinite; }
  .badge   { animation: pulse 3.4s ease-in-out infinite; }
</style>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#070b1d"/>
    <stop offset="0.45" stop-color="#11163a"/>
    <stop offset="0.78" stop-color="#3c0f2e"/>
    <stop offset="1" stop-color="#7f1420"/>
  </linearGradient>
  <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
    <stop offset="0" stop-color="#e63946" stop-opacity=".85"/>
    <stop offset="0.55" stop-color="#e63946" stop-opacity=".24"/>
    <stop offset="1" stop-color="#e63946" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="titleGrad" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#ffffff"/>
    <stop offset="0.5" stop-color="#ffd9dc"/>
    <stop offset="1" stop-color="#ffffff"/>
  </linearGradient>
  <linearGradient id="redline" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#e63946" stop-opacity="0"/>
    <stop offset="0.5" stop-color="#e63946"/>
    <stop offset="1" stop-color="#e63946" stop-opacity="0"/>
  </linearGradient>
</defs>

<rect width="1200" height="340" fill="url(#bg)"/>

<g class="web"><g stroke="#ffffff" stroke-width="1.2" fill="none" stroke-linecap="round">
  <line x1="0" y1="0" x2="130" y2="0"/>
  <line x1="0" y1="0" x2="122" y2="42"/>
  <line x1="0" y1="0" x2="103" y2="77"/>
  <line x1="0" y1="0" x2="76" y2="105"/>
  <line x1="0" y1="0" x2="41" y2="123"/>
  <line x1="0" y1="0" x2="0" y2="130"/>
  <polyline points="40,0 38.6,10.4 34.6,20 28.3,28.3 20,34.6 10.4,38.6 0,40"/>
  <polyline points="85,0 82.1,22 73.6,42.5 60.1,60.1 42.5,73.6 22,82.1 0,85"/>
  <polyline points="120,0 115.9,31 103.9,60 84.9,84.9 60,103.9 31,115.9 0,120"/>
</g></g>

<g class="web" transform="scale(-1,1) translate(-1200,0)"><g stroke="#ffffff" stroke-width="1.2" fill="none" stroke-linecap="round">
  <line x1="0" y1="0" x2="130" y2="0"/>
  <line x1="0" y1="0" x2="122" y2="42"/>
  <line x1="0" y1="0" x2="103" y2="77"/>
  <line x1="0" y1="0" x2="76" y2="105"/>
  <line x1="0" y1="0" x2="41" y2="123"/>
  <line x1="0" y1="0" x2="0" y2="130"/>
  <polyline points="40,0 38.6,10.4 34.6,20 28.3,28.3 20,34.6 10.4,38.6 0,40"/>
  <polyline points="85,0 82.1,22 73.6,42.5 60.1,60.1 42.5,73.6 22,82.1 0,85"/>
  <polyline points="120,0 115.9,31 103.9,60 84.9,84.9 60,103.9 31,115.9 0,120"/>
</g></g>

<ellipse class="halo" cx="600" cy="180" rx="430" ry="160" fill="url(#halo)"/>

<g class="swing">
<line x1="600" y1="0" x2="600" y2="86" stroke="#c7cede" stroke-width="1.6" stroke-dasharray="3 4"/>
<g stroke="#0a0f1e" stroke-width="3.4" stroke-linecap="round" fill="#0a0f1e"><path d="M 595.4 93.7 C 582.8 81.0 574.7 74.2 567.8 67.2" /><path d="M 604.6 93.7 C 617.2 81.0 625.3 74.2 632.2 67.2" /><path d="M 592.0 97.2 C 577.0 90.2 566.6 86.8 556.3 78.8" /><path d="M 608.0 97.2 C 623.0 90.2 633.4 86.8 643.7 78.8" /><path d="M 590.8 102.9 C 575.9 101.8 565.5 105.2 555.1 102.9" /><path d="M 609.2 102.9 C 624.1 101.8 634.5 105.2 644.9 102.9" /><path d="M 592.0 108.7 C 578.1 113.2 569.0 119.0 560.9 127.0" /><path d="M 608.0 108.7 C 621.9 113.2 631.0 119.0 639.1 127.0" /><ellipse cx="600" cy="97.2" rx="9.2" ry="6.9"/><ellipse cx="600" cy="114.4" rx="11.5" ry="16.1"/><path d="M 600 111.0 L 603.5 114.4 L 600 117.8 L 596.5 114.4 Z" fill="#e63946"/></g>
</g>

<g text-anchor="middle" font-family="Arial Black, Impact, Arial, sans-serif">
  <text class="title" x="600" y="202" font-size="74" font-weight="900" letter-spacing="10" fill="url(#titleGrad)">POTRINATHAN P M</text>
  <line x1="430" y1="226" x2="770" y2="226" stroke="url(#redline)" stroke-width="2"/>
  <text x="600" y="254" font-size="23" font-weight="700" letter-spacing="8" fill="#ff3d4d">FULL-STACK DEVELOPER · AI / ML ENGINEER</text>
  <text x="600" y="286" font-size="15" font-weight="600" letter-spacing="5" fill="#9fb0d8" font-family="Arial, sans-serif">BUILDING PRODUCTS · NOT JUST PROJECTS</text>
</g>

<g class="badge">
  <rect x="250" y="302" width="280" height="30" rx="15" fill="#e63946" fill-opacity="0.14" stroke="#e63946" stroke-opacity="0.7" stroke-width="1"/>
  <text x="390" y="321" font-size="13" font-weight="600" letter-spacing="2" fill="#ff8a94" font-family="Arial, sans-serif" text-anchor="middle">I AM POTRINATHAN P M</text>
</g>

<g class="badge">
  <rect x="560" y="302" width="430" height="30" rx="15" fill="#e63946" fill-opacity="0.14" stroke="#e63946" stroke-opacity="0.7" stroke-width="1"/>
  <text x="775" y="321" font-size="13" font-weight="600" letter-spacing="2" fill="#ff8a94" font-family="Arial, sans-serif" text-anchor="middle">WITH GREAT CODE · GREAT RESPONSIBILITY</text>
</g>

</svg>
