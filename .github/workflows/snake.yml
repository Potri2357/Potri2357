name: Contribution Snake

on:
  schedule:
    - cron: "5 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/snake.yml"]

concurrency:
  group: snake
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate the web-crawler
        uses: Platane/snk@v3.5.0
        with:
          github_user_name: ${{ github.repository_owner }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          outputs: |
            assets/github-snake.svg?color_snake=#e63946&color_dots=#161b22,#21262d,#6e0f1f,#e63946,#ff4d5d

      - name: Commit the web-crawler
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/github-snake.svg
          if git diff --staged --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "chore(snake): refresh contribution snake"
          for i in 1 2 3 4 5; do
            git pull --rebase origin main || { sleep 5; continue; }
            git push && exit 0
            sleep 5
          done
          exit 1
