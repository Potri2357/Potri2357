name: Metrics Dashboard

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/metrics.yml"]

concurrency:
  group: metrics
  cancel-in-progress: true

permissions:
  contents: write
  actions: read

jobs:
  update-metrics:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate GitHub metrics
        uses: lowlighter/metrics@v3.34
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config_timezone: Asia/Kolkata
          template: terminal
          base: header, activity, community, repositories, metadata
          base_indepth: yes
          base_hireable: yes
          plugin_languages: yes
          plugin_languages_sections: most-used
          plugin_languages_details: bytes-size, percentage
          plugin_languages_analysis_timeout: 30
          plugin_followup: yes
          plugin_followup_sections: repositories
          plugin_achievements: yes
          plugin_achievements_threshold: C
          plugin_achievements_secrets: yes
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
          plugin_people: yes
          plugin_people_types: followers, following
          plugin_people_size: 26
          plugin_people_limit: 20
          plugin_repositories: yes
          plugin_repositories_featured: Potri2357/LearnFlow, Potri2357/HandFree, Potri2357/LineX, Potri2357/Multilingual_Mandi, Potri2357/MathMax2K25, Potri2357/portfolio-template
          plugin_repositories_order: featured
          config_order: base.header, base.activity, base.repositories, plugin_languages, plugin_followup, plugin_isocalendar, plugin_people, plugin_achievements, base.metadata
          config_octicon: yes
          config_animations: yes
          config_padding: "14, 14"

      - name: Commit metrics dashboard
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add github-metrics.svg
          if git diff --staged --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "chore(metrics): refresh dashboard"
          git push
